jenkins:
  systemMessage: "gpu_driver_stack build farm (configured as code)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: http://localhost:8080/
jobs:
  - script: >
      multibranchPipelineJob('gpu-driver-stack') {
        branchSources {
          git {
            id('gpu-driver-stack')
            remote(System.getenv('REPO_URL'))
          }
        }
        factory {
          workflowBranchProjectFactory { scriptPath('Jenkinsfile') }
        }
        orphanedItemStrategy {
          discardOldItems { numToKeep(10) }
        }
        triggers {
          periodicFolderTrigger { interval('5m') }
        }
      }
