# Label a merged PR "backport release/1.x" and this opens a cherry-pick PR
# against that release branch. Conflicts are reported on the original PR.
name: backport

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: read

jobs:
  backport:
    # pull_request_target runs with write access, so this job never checks
    # out or runs code from the PR: the action only cherry-picks commits.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: korthout/backport-action@v3
        with:
          label_pattern: '^backport (release\/[^ ]+)$'
          pull_title: "[${target_branch}] ${pull_title}"
