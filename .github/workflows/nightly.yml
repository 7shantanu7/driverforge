# Nightly: the expensive checks that would slow every PR down.
#   * flaky-test hunt: the whole suite 25x, shuffled and parallel,
#     INCLUDING quarantined tests
#   * cold (no cache) build to track true build cost over time, compared
#     against the median of recent nights to catch build-time regressions
#   * nightly packages with short retention, for anyone who wants to test
#     main before a release
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC, off the top of the hour
  workflow_dispatch:

# bash (with -eo pipefail) everywhere, including container jobs, whose
# default shell is otherwise plain `sh`.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  flaky-hunt:
    name: flaky-test hunt (25 runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install_deps.sh build clang-18
      - name: Build
        run: |
          cmake --preset ci-debug
          cmake --build --preset ci-debug
      - name: Run the suite 25 times and report unstable tests
        run: scripts/ci/flaky_hunt.sh build/ci-debug 25
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-hunt
          path: build/ci-debug/flaky-hunt/
          retention-days: 14

  build-time:
    name: cold build metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install_deps.sh build
      - name: Cold build (compiler cache disabled)
        run: |
          cmake --preset ci-release -DDRIVERFORGE_COMPILER_CACHE=none
          cmake --build --preset ci-release
          ctest --preset ci-release --output-junit "$PWD/build/ci-release/junit.xml"
          PYTHONPATH=tools/buildstats python3 -m buildstats collect build/ci-release \
            --label nightly-cold --junit build/ci-release/junit.xml --no-ccache -o metrics.json
          PYTHONPATH=tools/buildstats python3 -m buildstats markdown metrics.json >> "$GITHUB_STEP_SUMMARY"
      - name: Restore recent nights' metrics
        uses: actions/cache/restore@v6
        with:
          path: metrics-history.json
          key: nightly-history-${{ github.run_id }}
          restore-keys: nightly-history-
      # Compared with the MEDIAN of the last 7 nights, not just last night:
      # shared runners vary a lot in speed, so one slow (or fast) night must
      # not decide the result. The floor is high because a cold build here is
      # only a few tens of CPU-seconds. Needs 3 nights of history to fail.
      - name: Compare with recent nights (fails on >25% compile-time growth)
        run: |
          PYTHONPATH=tools/buildstats python3 -m buildstats compare metrics-history.json metrics.json \
            --min-samples 3 --min-seconds 20
      # Record tonight even when the gate fails. Otherwise the baseline never
      # moves and every later night is judged against the same stale number.
      - name: Record tonight in the history
        if: ${{ !cancelled() && hashFiles('metrics.json') != '' }}
        run: PYTHONPATH=tools/buildstats python3 -m buildstats history metrics-history.json metrics.json --keep 7
      - if: ${{ !cancelled() && hashFiles('metrics-history.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: metrics-history.json
          key: nightly-history-${{ github.run_id }}
      - if: ${{ !cancelled() && hashFiles('metrics.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-metrics
          path: metrics.json
          retention-days: 90

  packages:
    name: nightly packages
    uses: ./.github/workflows/packages.yml
    with:
      retention-days: 7
